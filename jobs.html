<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jobs - Jobify</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav class="navbar navbar-expand-lg bg-white py-3">
        <div class="container">
            <a class="navbar-brand fw-bold fs-3 text-primary" href="index.html">
                Jobify
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav mx-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="jobs.html">Jobs</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="about.html">About</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="contact.html">Contact</a>
                    </li>
                </ul>

                <div class="d-flex gap-2" id="authLinks">
                    <a href="login.html" class="btn btn-outline-primary px-4">Login</a>
                    <a href="register.html" class="btn btn-primary px-4">Register</a>
                </div>
            </div>
        </div>
    </nav>

    <section class="jobs-section">
        <div class="container">

            <div class="jobs-header">
                <h1>Find Your Next Job</h1>
                <p>Explore job opportunities and find the right position for you.</p>
            </div>

            <div class="job-search">
                <div class="row g-2">
                    <div class="col-lg-5">
                        <div class="search-field">
                            <i class="bi bi-search"></i>
                            <input type="text" id="jobSearch" placeholder="Search job title or keyword">
                        </div>
                    </div>

                    <div class="col-lg-3">
                        <select class="form-select" id="categoryFilter">
                            <option value="">All Categories</option>
                            <option value="Development">Development</option>
                            <option value="Design">Design</option>
                            <option value="Marketing">Marketing</option>
                            <option value="Business">Business</option>
                            <option value="Engineering">Engineering</option>
                        </select>
                    </div>

                    <div class="col-lg-2">
                        <select class="form-select" id="typeFilter">
                            <option value="">All Types</option>
                            <option value="Full Time">Full Time</option>
                            <option value="Part Time">Part Time</option>
                            <option value="Remote">Remote</option>
                        </select>
                    </div>

                    <div class="col-lg-2">
                        <button class="btn btn-primary w-100" id="searchButton">
                            Search
                        </button>
                    </div>
                </div>
            </div>

            <div class="jobs-content">

                <div class="jobs-top">
                    <h4>Available Jobs</h4>
                    <span id="jobCount">0 Jobs</span>
                </div>

                <div class="row g-4" id="jobsContainer"></div>

            </div>

        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>

</body>

</html>
